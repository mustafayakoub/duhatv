version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════
# Quran Modern Stack - Docker Compose Configuration
# نظام قرآني متكامل بثلاث لغات برمجية
#
# Services:
#   - PostgreSQL (قاعدة البيانات)
#   - Redis (الكاش)
#   - Rust Backend API (الخادم الرئيسي)
#   - Go Search Service (خدمة البحث)
#   - TypeScript Frontend (الواجهة)
#   - Migration Service (نقل البيانات)
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: quran-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: quran_db
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran_secure_pass_2025
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=ar_SA.UTF-8 --lc-ctype=ar_SA.UTF-8"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
      - ./database/seeds:/seeds:ro

    ports:
      - "5432:5432"

    networks:
      - quran-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis Cache
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: quran-redis
    restart: unless-stopped

    command: redis-server --appendonly yes --requirepass redis_secure_pass_2025

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    networks:
      - quran-network

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Rust Backend API (Axum)
  # ═══════════════════════════════════════════════════════════════════════════
  backend-rust:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    container_name: quran-backend-rust
    restart: unless-stopped

    environment:
      # Database
      DATABASE_URL: postgresql://quran:quran_secure_pass_2025@postgres:5432/quran_db

      # Redis
      REDIS_URL: redis://:redis_secure_pass_2025@redis:6379

      # Server
      HOST: 0.0.0.0
      PORT: 8000
      RUST_LOG: info

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - quran-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # Go Search Microservice
  # ═══════════════════════════════════════════════════════════════════════════
  search-service-go:
    build:
      context: ./services-go/search-service
      dockerfile: Dockerfile
    container_name: quran-search-go
    restart: unless-stopped

    environment:
      # Database
      DATABASE_URL: postgresql://quran:quran_secure_pass_2025@postgres:5432/quran_db

      # Redis
      REDIS_URL: redis://:redis_secure_pass_2025@redis:6379

      # Server
      PORT: 8001
      GO_ENV: production

    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - quran-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # TypeScript Frontend (React + Vite)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend-ts
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_SEARCH_API_URL: http://localhost:8001
    container_name: quran-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SEARCH_API_URL: http://localhost:8001

    ports:
      - "3000:80"

    depends_on:
      - backend-rust
      - search-service-go

    networks:
      - quran-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # Migration Service (Python)
  # يعمل مرة واحدة لنقل البيانات من القواعد الثلاث
  # ═══════════════════════════════════════════════════════════════════════════
  migration:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: quran-migration

    environment:
      # Target Database
      TARGET_DB_URL: postgresql://quran:quran_secure_pass_2025@postgres:5432/quran_db

      # Source Databases (mount من الهوست)
      SOURCE_DB_1: /source-dbs/quran_ultimate_final.db
      SOURCE_DB_2: /source-dbs/surah_database_app_v32.db
      SOURCE_DB_3: /source-dbs/Quran_Crystalline.db

    volumes:
      # قواعد البيانات المصدر (من Windows)
      - C:/quran9:/source-dbs:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - quran-network

    # يعمل مرة واحدة فقط
    command: python migrate_data.py
    restart: "no"

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  quran-network:
    driver: bridge
    name: quran-network

# ═══════════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
    name: quran_postgres_data

  redis_data:
    driver: local
    name: quran_redis_data

# ═══════════════════════════════════════════════════════════════════════════
# Usage:
#
# تشغيل كل الخدمات:
#   docker-compose up -d
#
# تشغيل خدمة محددة:
#   docker-compose up -d postgres
#
# عرض اللوج:
#   docker-compose logs -f backend-rust
#
# إيقاف كل الخدمات:
#   docker-compose down
#
# إيقاف وحذف البيانات:
#   docker-compose down -v
#
# إعادة بناء الصور:
#   docker-compose build --no-cache
#
# تطبيق Migration:
#   docker-compose run --rm migration
#
# ═══════════════════════════════════════════════════════════════════════════
