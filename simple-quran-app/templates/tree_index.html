<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 عارض القرآن الشجري - Quran Tree Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-box .number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: right;
        }

        .search-input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .surahs-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .surahs-panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .surah-item {
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-right: 4px solid transparent;
        }

        .surah-item:hover {
            background: #e9ecef;
            border-right-color: #667eea;
            transform: translateX(-5px);
        }

        .surah-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-right-color: #667eea;
        }

        .surah-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .surah-item.active .surah-number {
            background: white;
            color: #667eea;
        }

        .details-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .ayah-item {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-right: 4px solid #667eea;
        }

        .ayah-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .ayah-number {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .ayah-text {
            font-size: 1.8em;
            line-height: 2.2;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: justify;
        }

        .words-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #dee2e6;
        }

        .word-item {
            display: inline-block;
            margin: 10px;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .word-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            border-color: #764ba2;
        }

        .word-text {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .word-details {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 300px;
            max-width: 400px;
        }

        .word-item:hover .word-details {
            display: block;
        }

        .detail-section {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .detail-label {
            font-weight: bold;
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .detail-text {
            color: #495057;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .toggle-words-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .toggle-words-btn:hover {
            background: #764ba2;
        }

        .search-results {
            margin-top: 20px;
        }

        .search-result-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-right: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-result-item:hover {
            background: #e9ecef;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌙 عارض القرآن الشجري</h1>
            <p>القرآن الكريم كاملاً مع الإعراب والصرف</p>

            <div class="stats" id="stats">
                <div class="stat-box">
                    <span class="number" id="stat-surahs">-</span>
                    <span class="label">سورة</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-ayahs">-</span>
                    <span class="label">آية</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-words">-</span>
                    <span class="label">كلمة</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-irab">-</span>
                    <span class="label">إعراب</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-sarf">-</span>
                    <span class="label">صرف</span>
                </div>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث في القرآن الكريم...">
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Surahs Panel -->
            <div class="surahs-panel">
                <h2>📚 السور</h2>
                <div id="surahsList">
                    <div class="loading">جاري التحميل</div>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="details-panel">
                <div id="detailsContent" class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h3>اختر سورة من القائمة</h3>
                    <p>سيتم عرض الآيات والكلمات مع الإعراب والصرف</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // تحميل الإحصائيات
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('stat-surahs').textContent = data.data.surahs.toLocaleString('ar-EG');
                    document.getElementById('stat-ayahs').textContent = data.data.ayahs.toLocaleString('ar-EG');
                    document.getElementById('stat-words').textContent = data.data.words.toLocaleString('ar-EG');
                    document.getElementById('stat-irab').textContent = data.data.irab.toLocaleString('ar-EG');
                    document.getElementById('stat-sarf').textContent = data.data.sarf.toLocaleString('ar-EG');
                }
            } catch (error) {
                console.error('خطأ في تحميل الإحصائيات:', error);
            }
        }

        // تحميل السور
        async function loadSurahs() {
            try {
                const response = await fetch('/api/surahs');
                const data = await response.json();

                if (data.success) {
                    const surahsList = document.getElementById('surahsList');
                    surahsList.innerHTML = '';

                    data.data.forEach(surah => {
                        const item = document.createElement('div');
                        item.className = 'surah-item';
                        item.innerHTML = `
                            <span class="surah-number">${surah.surah_id}</span>
                            <strong>${surah.name_arabic}</strong>
                            <br>
                            <small>${surah.ayah_count} آية • ${surah.revelation_type === 'Meccan' ? 'مكية' : 'مدنية'}</small>
                        `;
                        item.onclick = () => loadAyahs(surah.surah_id, surah.name_arabic);
                        surahsList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('خطأ في تحميل السور:', error);
                document.getElementById('surahsList').innerHTML = '<div class="error">خطأ في التحميل</div>';
            }
        }

        // تحميل آيات سورة
        async function loadAyahs(surahId, surahName) {
            // تحديث الحالة النشطة
            document.querySelectorAll('.surah-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const detailsContent = document.getElementById('detailsContent');
            detailsContent.innerHTML = '<div class="loading">جاري تحميل الآيات</div>';

            try {
                const response = await fetch(`/api/surah/${surahId}/ayahs`);
                const data = await response.json();

                if (data.success) {
                    detailsContent.innerHTML = `<h2 style="color: #667eea; margin-bottom: 20px;">📖 ${surahName}</h2>`;

                    for (const ayah of data.data) {
                        const ayahDiv = document.createElement('div');
                        ayahDiv.className = 'ayah-item';
                        ayahDiv.innerHTML = `
                            <div class="ayah-header">
                                <span class="ayah-number">آية ${ayah.ayah_number}</span>
                                <small>الجزء ${ayah.juz_number || '-'} • الصفحة ${ayah.page_number || '-'}</small>
                            </div>
                            <div class="ayah-text">${ayah.text_uthmani}</div>
                            <button class="toggle-words-btn" onclick="loadWords(${ayah.ayah_id}, this)">
                                🔍 عرض الكلمات مع الإعراب والصرف
                            </button>
                            <div class="words-container" id="words-${ayah.ayah_id}" style="display: none;"></div>
                        `;
                        detailsContent.appendChild(ayahDiv);
                    }
                }
            } catch (error) {
                console.error('خطأ في تحميل الآيات:', error);
                detailsContent.innerHTML = '<div class="error">خطأ في التحميل</div>';
            }
        }

        // تحميل كلمات آية
        async function loadWords(ayahId, button) {
            const container = document.getElementById(`words-${ayahId}`);

            if (container.style.display === 'none') {
                container.innerHTML = '<div class="loading">جاري تحميل الكلمات</div>';
                container.style.display = 'block';
                button.textContent = '🔼 إخفاء الكلمات';

                try {
                    const response = await fetch(`/api/ayah/${ayahId}/words`);
                    const data = await response.json();

                    if (data.success) {
                        container.innerHTML = '<h4 style="color: #667eea; margin-bottom: 15px;">الكلمات مع الإعراب والصرف:</h4>';

                        data.data.forEach(word => {
                            const wordDiv = document.createElement('div');
                            wordDiv.className = 'word-item';
                            wordDiv.innerHTML = `
                                <div class="word-text">${word.word_text}</div>
                                <div class="word-details">
                                    ${word.word_simple ? `
                                        <div class="detail-section">
                                            <span class="detail-label">بدون تشكيل:</span>
                                            <span class="detail-text">${word.word_simple}</span>
                                        </div>
                                    ` : ''}
                                    ${word.root_text ? `
                                        <div class="detail-section">
                                            <span class="detail-label">الجذر:</span>
                                            <span class="detail-text">${word.root_text}</span>
                                        </div>
                                    ` : ''}
                                    ${word.irab_text ? `
                                        <div class="detail-section">
                                            <span class="detail-label">الإعراب:</span>
                                            <span class="detail-text">${word.irab_text}</span>
                                        </div>
                                    ` : ''}
                                    ${word.sarf_text ? `
                                        <div class="detail-section">
                                            <span class="detail-label">الصرف:</span>
                                            <span class="detail-text">${word.sarf_text}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                            container.appendChild(wordDiv);
                        });
                    }
                } catch (error) {
                    console.error('خطأ في تحميل الكلمات:', error);
                    container.innerHTML = '<div class="error">خطأ في التحميل</div>';
                }
            } else {
                container.style.display = 'none';
                button.textContent = '🔍 عرض الكلمات مع الإعراب والصرف';
            }
        }

        // البحث
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await response.json();

                    const resultsDiv = document.getElementById('searchResults');
                    if (data.success && data.count > 0) {
                        resultsDiv.innerHTML = `<h3 style="color: #667eea; margin: 15px 0;">النتائج (${data.count}):</h3>`;

                        data.data.forEach(result => {
                            const item = document.createElement('div');
                            item.className = 'search-result-item';
                            item.innerHTML = `
                                <strong>${result.name_arabic} - آية ${result.ayah_number}</strong>
                                <p>${result.text_uthmani}</p>
                            `;
                            item.onclick = () => {
                                loadAyahs(result.surah_id, result.name_arabic);
                                document.getElementById('searchInput').value = '';
                                resultsDiv.innerHTML = '';
                            };
                            resultsDiv.appendChild(item);
                        });
                    } else if (data.count === 0) {
                        resultsDiv.innerHTML = '<p style="padding: 15px; color: #6c757d;">لا توجد نتائج</p>';
                    }
                } catch (error) {
                    console.error('خطأ في البحث:', error);
                }
            }, 300);
        });

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('load', () => {
            loadStats();
            loadSurahs();
        });
    </script>
</body>
</html>
