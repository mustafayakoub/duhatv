<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 عارض القرآن الشجري - Quran Tree Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-box .number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Tabs */
        .tabs {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .tab-buttons {
            display: flex;
            background: #f8f9fa;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            border: none;
            background: transparent;
            font-size: 1.2em;
            font-weight: bold;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: #e9ecef;
        }

        .tab-button.active {
            color: #667eea;
            background: white;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* Search Filters */
        .search-filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            background: #f8f9fa;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: right;
        }

        .search-input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .surahs-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .surahs-panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .surah-item {
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-right: 4px solid transparent;
        }

        .surah-item:hover {
            background: #e9ecef;
            border-right-color: #667eea;
            transform: translateX(-5px);
        }

        .surah-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-right-color: #667eea;
        }

        .surah-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .surah-item.active .surah-number {
            background: white;
            color: #667eea;
        }

        .details-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* نمط الآية */
        .ayah-line {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-right: 3px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ayah-line:hover {
            background: #e9ecef;
            transform: translateX(-3px);
        }

        .ayah-text-inline {
            font-size: 1.5em;
            line-height: 1.8;
            color: #2c3e50;
            display: inline;
        }

        .ayah-number-inline {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Modal للكلمات */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close {
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            line-height: 1;
        }

        .close:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .word-card {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            transition: all 0.3s;
        }

        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* تنسيق جديد للكلمة */
        .word-title-line {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea10 0%, #764ba220 100%);
            border-radius: 8px;
        }

        .word-text {
            display: inline;
        }

        .word-root {
            display: inline;
            color: #764ba2;
            margin-right: 10px;
        }

        .word-positions-line {
            padding: 10px 15px;
            margin: 8px 0;
            background: white;
            border-radius: 5px;
            border-right: 3px solid #667eea;
            font-size: 1.1em;
            line-height: 1.8;
        }

        .word-info-line {
            padding: 10px 15px;
            margin: 8px 0;
            background: white;
            border-radius: 5px;
            border-right: 3px solid #667eea;
            font-size: 1.1em;
            line-height: 1.8;
        }

        .word-info-label {
            font-weight: bold;
            color: #667eea;
            display: inline-block;
            min-width: 120px;
        }

        .word-info-value {
            color: #495057;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* Search Results Tree */
        .search-tree-results {
            margin-top: 20px;
        }

        .search-tree-surah {
            margin: 20px 0;
        }

        .search-tree-surah-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-tree-surah-header:hover {
            transform: translateX(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .search-tree-ayahs {
            margin-top: 10px;
            padding-right: 20px;
        }

        .highlight {
            background-color: #ffeb3b;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .results-count {
            color: #667eea;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-right: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌙 عارض القرآن الشجري</h1>
            <p>القرآن الكريم كاملاً مع الإعراب والصرف</p>

            <div class="stats" id="stats">
                <div class="stat-box">
                    <span class="number" id="stat-surahs">-</span>
                    <span class="label">سورة</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-ayahs">-</span>
                    <span class="label">آية</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-words">-</span>
                    <span class="label">كلمة</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-irab">-</span>
                    <span class="label">إعراب</span>
                </div>
                <div class="stat-box">
                    <span class="number" id="stat-sarf">-</span>
                    <span class="label">صرف</span>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="switchTab('browse')">
                    📖 العرض والتصفح
                </button>
                <button class="tab-button" onclick="switchTab('search')">
                    🔍 البحث
                </button>
            </div>

            <!-- Browse Tab -->
            <div id="browseTab" class="tab-content active">
                <div class="content">
                    <!-- Surahs Panel -->
                    <div class="surahs-panel">
                        <h2>📚 السور</h2>
                        <div id="surahsList">
                            <div class="loading">جاري التحميل</div>
                        </div>
                    </div>

                    <!-- Details Panel -->
                    <div class="details-panel">
                        <div id="detailsContent" class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <h3>اختر سورة من القائمة</h3>
                            <p>سيتم عرض الآيات والكلمات مع الإعراب والصرف</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search Tab -->
            <div id="searchTab" class="tab-content">
                <div style="max-width: 1000px; margin: 0 auto;">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث في القرآن الكريم... (اكتب حرفين على الأقل)">

                    <div class="search-filters">
                        <button class="filter-btn active" data-type="text" onclick="setSearchFilter('text')">
                            📝 بحث نصي
                        </button>
                        <button class="filter-btn" data-type="root" onclick="setSearchFilter('root')">
                            🌳 بحث بالجذر
                        </button>
                    </div>

                    <div id="searchResults" class="search-tree-results"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal للكلمات -->
    <div id="wordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">تفاصيل الكلمات</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- سيتم ملؤه بالمحتوى -->
            </div>
        </div>
    </div>

    <script>
        let currentSurahId = null;
        let currentSurahName = null;
        let searchFilterType = 'text';

        // Switch between tabs
        function switchTab(tab) {
            // Update buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            if (tab === 'browse') {
                document.getElementById('browseTab').classList.add('active');
            } else if (tab === 'search') {
                document.getElementById('searchTab').classList.add('active');
                document.getElementById('searchInput').focus();
            }
        }

        // Set search filter
        function setSearchFilter(type) {
            searchFilterType = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Trigger search again if there's a query
            const query = document.getElementById('searchInput').value.trim();
            if (query.length >= 2) {
                performSearch(query);
            }
        }

        // تحميل الإحصائيات
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('stat-surahs').textContent = data.data.surahs.toLocaleString('ar-EG');
                    document.getElementById('stat-ayahs').textContent = data.data.ayahs.toLocaleString('ar-EG');
                    document.getElementById('stat-words').textContent = data.data.words.toLocaleString('ar-EG');
                    document.getElementById('stat-irab').textContent = data.data.irab.toLocaleString('ar-EG');
                    document.getElementById('stat-sarf').textContent = data.data.sarf.toLocaleString('ar-EG');
                }
            } catch (error) {
                console.error('خطأ في تحميل الإحصائيات:', error);
            }
        }

        // تحميل السور
        async function loadSurahs() {
            try {
                const response = await fetch('/api/surahs');
                const data = await response.json();

                if (data.success) {
                    const surahsList = document.getElementById('surahsList');
                    surahsList.innerHTML = '';

                    data.data.forEach(surah => {
                        const item = document.createElement('div');
                        item.className = 'surah-item';
                        item.dataset.surahId = surah.surah_id;
                        item.innerHTML = `
                            <span class="surah-number">${surah.surah_id}</span>
                            <strong>${surah.name_arabic}</strong>
                            <br>
                            <small>${surah.ayah_count} آية • ${surah.revelation_type === 'Meccan' ? 'مكية' : 'مدنية'}</small>
                        `;
                        item.onclick = () => loadAyahs(surah.surah_id, surah.name_arabic);
                        surahsList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('خطأ في تحميل السور:', error);
                document.getElementById('surahsList').innerHTML = '<div class="error">خطأ في التحميل</div>';
            }
        }

        // تحميل آيات سورة
        async function loadAyahs(surahId, surahName) {
            currentSurahId = surahId;
            currentSurahName = surahName;

            // تحديث الحالة النشطة
            document.querySelectorAll('.surah-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.surahId) === surahId) {
                    item.classList.add('active');
                }
            });

            const detailsContent = document.getElementById('detailsContent');
            detailsContent.innerHTML = '<div class="loading">جاري تحميل الآيات</div>';

            try {
                const response = await fetch(`/api/surah/${surahId}/ayahs`);
                const data = await response.json();

                if (data.success) {
                    detailsContent.innerHTML = `<h2 style="color: #667eea; margin-bottom: 20px;">📖 ${surahName}</h2>`;

                    data.data.forEach(ayah => {
                        const ayahDiv = document.createElement('div');
                        ayahDiv.className = 'ayah-line';
                        ayahDiv.onclick = () => loadWords(ayah.ayah_id);
                        ayahDiv.innerHTML = `
                            <span class="ayah-text-inline">${ayah.text_uthmani}</span>
                            <span class="ayah-number-inline">${ayah.ayah_number}</span>
                        `;
                        detailsContent.appendChild(ayahDiv);
                    });
                }
            } catch (error) {
                console.error('خطأ في تحميل الآيات:', error);
                detailsContent.innerHTML = '<div class="error">خطأ في التحميل</div>';
            }
        }

        // تحميل كلمات آية وعرضها في Modal
        async function loadWords(ayahId) {
            const modal = document.getElementById('wordModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = '<div class="loading">جاري تحميل الكلمات</div>';
            modal.style.display = 'block';

            try {
                const response = await fetch(`/api/ayah/${ayahId}/words`);
                const data = await response.json();

                if (data.success) {
                    modalBody.innerHTML = '';

                    data.data.forEach(word => {
                        const wordCard = document.createElement('div');
                        wordCard.className = 'word-card';

                        // التنسيق الجديد: الكلمة + الجذر في سطر واحد
                        let content = '<div class="word-title-line">';
                        content += `<span class="word-text">${word.word_simple || word.word_text}</span>`;
                        if (word.root_text) {
                            content += ` <span class="word-root">(${word.root_text})</span>`;
                        }
                        content += '</div>';

                        // السطر الثاني: ترتيبها في المصحف + ترتيبها في السورة
                        if (word.position_in_quran || word.position_in_surah) {
                            content += '<div class="word-positions-line">';
                            if (word.position_in_quran) {
                                content += `<span class="word-info-label">ترتيبها في المصحف:</span> `;
                                content += `<span class="word-info-value">${word.position_in_quran.toLocaleString('ar-EG')}</span>`;
                            }
                            if (word.position_in_surah) {
                                content += ` • `;
                                content += `<span class="word-info-label">ترتيبها في السورة:</span> `;
                                content += `<span class="word-info-value">${word.position_in_surah.toLocaleString('ar-EG')}</span>`;
                            }
                            content += '</div>';
                        }

                        // الإعراب والصرف
                        if (word.irab_text) {
                            content += `<div class="word-info-line">
                                <span class="word-info-label">الإعراب:</span>
                                <span class="word-info-value">${word.irab_text}</span>
                            </div>`;
                        }

                        if (word.sarf_text) {
                            content += `<div class="word-info-line">
                                <span class="word-info-label">الصرف:</span>
                                <span class="word-info-value">${word.sarf_text}</span>
                            </div>`;
                        }

                        wordCard.innerHTML = content;
                        modalBody.appendChild(wordCard);
                    });
                }
            } catch (error) {
                console.error('خطأ في تحميل الكلمات:', error);
                modalBody.innerHTML = '<div class="error">خطأ في التحميل</div>';
            }
        }

        // إغلاق Modal
        function closeModal() {
            document.getElementById('wordModal').style.display = 'none';
        }

        // إغلاق Modal بالضغط خارجه
        window.onclick = function(event) {
            const modal = document.getElementById('wordModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // البحث الذكي - الفوري
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            // بحث فوري بعد 300ms
            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 300);
        });

        async function performSearch(query) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="loading">جاري البحث</div>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&type=${searchFilterType}`);
                const data = await response.json();

                if (data.success && data.count > 0) {
                    resultsDiv.innerHTML = `<div class="results-count">إنشاء النتائج • العدد: ${data.count.toLocaleString('ar-EG')} آية في ${data.total_surahs.toLocaleString('ar-EG')} سورة</div>`;

                    // عرض شجري للنتائج
                    data.data.forEach(surah => {
                        const surahDiv = document.createElement('div');
                        surahDiv.className = 'search-tree-surah';

                        const surahHeader = document.createElement('div');
                        surahHeader.className = 'search-tree-surah-header';
                        surahHeader.textContent = `${surah.name_arabic} (${surah.ayahs.length} آية)`;
                        surahDiv.appendChild(surahHeader);

                        const ayahsDiv = document.createElement('div');
                        ayahsDiv.className = 'search-tree-ayahs';

                        surah.ayahs.forEach(ayah => {
                            const ayahDiv = document.createElement('div');
                            ayahDiv.className = 'ayah-line';
                            ayahDiv.onclick = () => loadWords(ayah.ayah_id);

                            // تمييز النص المطابق
                            let highlightedText = ayah.text_uthmani;
                            try {
                                // إزالة التشكيل من النص للمقارنة
                                const normalizedText = removeArabicDiacritics(ayah.text_uthmani);
                                const normalizedQuery = removeArabicDiacritics(query);

                                const index = normalizedText.indexOf(normalizedQuery);
                                if (index !== -1) {
                                    const start = index;
                                    const end = index + normalizedQuery.length;
                                    highlightedText = ayah.text_uthmani.substring(0, start) +
                                        '<span class="highlight">' + ayah.text_uthmani.substring(start, end) + '</span>' +
                                        ayah.text_uthmani.substring(end);
                                }
                            } catch (e) {
                                // fallback to simple highlighting
                                highlightedText = ayah.text_uthmani;
                            }

                            ayahDiv.innerHTML = `
                                <span class="ayah-text-inline">${highlightedText}</span>
                                <span class="ayah-number-inline">${ayah.ayah_number}</span>
                            `;
                            ayahsDiv.appendChild(ayahDiv);
                        });

                        surahDiv.appendChild(ayahsDiv);
                        resultsDiv.appendChild(surahDiv);
                    });
                } else if (data.count === 0) {
                    resultsDiv.innerHTML = '<p style="padding: 15px; color: #6c757d; text-align: center;">لا توجد نتائج</p>';
                }
            } catch (error) {
                console.error('خطأ في البحث:', error);
                resultsDiv.innerHTML = '<div class="error">خطأ في البحث</div>';
            }
        }

        // دالة لإزالة التشكيل (مطابقة لما في Python)
        function removeArabicDiacritics(text) {
            return text.replace(/[\u064B-\u0652\u0640]/g, '');
        }

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('load', () => {
            loadStats();
            loadSurahs();
        });

        // إغلاق Modal بمفتاح Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
