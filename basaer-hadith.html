              <div className="flex gap-1">
                <button
                  onClick={() => setCurrentView('books')}
                  className={`px-6 py-3 font-bold transition-all ${
                    currentView === 'books'
                      ? 'bg-golden-100 text-golden-800 border-b-4 border-golden-500'
                      : 'text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  📚 الكتب
                </button>
                <button
                  onClick={() => setCurrentView('thematic')}
                  className={`px-6 py-3 font-bold transition-all ${
                    currentView === 'thematic'
                      ? 'bg-golden-100 text-golden-800 border-b-4 border-golden-500'
                      : 'text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  🗂️ التصنيف الموضوعي
                </button>
                <button
                  onClick={() => setCurrentView('search')}
                  className={`px-6 py-3 font-bold transition-all ${
                    currentView === 'search'
                      ? 'bg-golden-100 text-golden-800 border-b-4 border-golden-500'
                      : 'text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  🔍 البحث الذكي
                </button>
                <button
                  onClick={() => setCurrentView('stats')}
                  className={`px-6 py-3 font-bold transition-all ${
                    currentView === 'stats'
                      ? 'bg-golden-100 text-golden-800 border-b-4 border-golden-500'
                      : 'text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  📊 الإحصائيات
                </button>
              </div>
            </div>
          </nav>

          {/* المحتوى الرئيسي */}
          <main className="flex-1 overflow-y-auto scrollbar-golden">
            <div className="container mx-auto px-4 py-6">
              {/* عرض الكتب */}
              {currentView === 'books' && !selectedBook && (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {HADITH_BOOKS.map(book => (
                    <div
                      key={book.id}
                      onClick={() => setSelectedBook(book)}
                      className="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-all cursor-pointer border-2 border-transparent hover:border-golden-400 p-6"
                    >
                      <div className="flex items-start justify-between mb-4">
                        <div className="flex-1">
                          <h3 className="text-xl font-bold text-gray-800 mb-1">{book.nameAr}</h3>
                          <p className="text-sm text-gray-500">{book.nameEn}</p>
                        </div>
                        <span className={`text-3xl ${book.color === 'golden' ? 'filter hue-rotate-15' : ''}`}>
                          📖
                        </span>
                      </div>
                      <p className="text-gray-700 text-sm mb-3">{book.author}</p>
                      <div className="flex items-center justify-between text-sm text-gray-600 mb-3">
                        <span>📊 {book.totalHadith.toLocaleString('ar')} حديث</span>
                        {book.chapters > 0 && <span>📑 {book.chapters} باب</span>}
                      </div>
                      <div className={`text-xs px-3 py-2 rounded-lg ${
                        book.color === 'golden' ? 'bg-golden-100 text-golden-800' : 'bg-bronze-100 text-bronze-800'
                      }`}>
                        {book.grade}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* عرض أحاديث الكتاب المختار */}
              {currentView === 'books' && selectedBook && !selectedHadith && (
                <div>
                  <div className="mb-6 flex items-center justify-between">
                    <button
                      onClick={() => setSelectedBook(null)}
                      className="flex items-center gap-2 text-golden-700 hover:text-golden-900"
                    >
                      ← الرجوع للكتب
                    </button>
                    <div className="text-center">
                      <h2 className="text-2xl font-bold text-golden-800">{selectedBook.nameAr}</h2>
                      <p className="text-gray-600">{selectedBook.author}</p>
                    </div>
                    <div></div>
                  </div>

                  <div className="space-y-4">
                    {SAMPLE_HADITHS.filter(h => h.book === selectedBook.id).map(hadith => (
                      <div
                        key={hadith.id}
                        onClick={() => setSelectedHadith(hadith)}
                        className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-golden-400 p-5"
                      >
                        <div className="flex items-start justify-between mb-3">
                          <span className={`px-3 py-1 rounded-lg text-xs font-bold ${hadith.gradeClass}`}>
                            {hadith.grade}
                          </span>
                          <span className="text-sm text-gray-500">رقم {hadith.bookNumber}</span>
                        </div>
                        <p className="text-gray-800 leading-relaxed mb-3" style={{ fontSize: `${fontSize - 2}px` }}>
                          {hadith.matn.substring(0, 200)}...
                        </p>
                        <div className="flex items-center justify-between text-sm text-gray-600">
                          <span>👤 {hadith.narrator}</span>
                          <span>📂 {hadith.chapter}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* عرض تفاصيل الحديث */}
              {selectedHadith && (
                <div className="max-w-4xl mx-auto">
                  <div className="mb-4">
                    <button
                      onClick={() => setSelectedHadith(null)}
                      className="flex items-center gap-2 text-golden-700 hover:text-golden-900"
                    >
                      ← الرجوع
                    </button>
                  </div>
                  <div className="bg-white rounded-xl shadow-lg">
                    {renderHadithDetail(selectedHadith)}
                  </div>
                </div>
              )}

              {/* التصنيف الموضوعي */}
              {currentView === 'thematic' && !selectedTheme && (
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                  {THEMATIC_CATEGORIES.map(cat => (
                    <div
                      key={cat.id}
                      onClick={() => setSelectedTheme(cat)}
                      className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer p-6 text-center border-2 border-transparent hover:border-golden-400"
                    >
                      <div className="text-5xl mb-3">{cat.icon}</div>
                      <h3 className="font-bold text-gray-800 mb-2">{cat.nameAr}</h3>
                      <p className="text-sm text-gray-600">{cat.count.toLocaleString('ar')} حديث</p>
                    </div>
                  ))}
                </div>
              )}

              {/* أحاديث الموضوع المختار */}
              {currentView === 'thematic' && selectedTheme && (
                <div>
                  <div className="mb-6 flex items-center justify-between">
                    <button
                      onClick={() => setSelectedTheme(null)}
                      className="flex items-center gap-2 text-golden-700 hover:text-golden-900"
                    >
                      ← الرجوع للمواضيع
                    </button>
                    <div className="text-center">
                      <div className="text-5xl mb-2">{selectedTheme.icon}</div>
                      <h2 className="text-2xl font-bold text-golden-800">{selectedTheme.nameAr}</h2>
                      <p className="text-gray-600">{selectedTheme.count.toLocaleString('ar')} حديث</p>
                    </div>
                    <div></div>
                  </div>

                  <div className="space-y-4">
                    {SAMPLE_HADITHS.filter(h => h.theme === selectedTheme.id).map(hadith => (
                      <div
                        key={hadith.id}
                        onClick={() => setSelectedHadith(hadith)}
                        className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-golden-400 p-5"
                      >
                        <div className="flex items-start justify-between mb-3">
                          <div>
                            <span className={`px-3 py-1 rounded-lg text-xs font-bold ${hadith.gradeClass}`}>
                              {hadith.grade}
                            </span>
                            <span className="mr-2 text-sm text-gray-600">
                              {HADITH_BOOKS.find(b => b.id === hadith.book)?.nameAr}
                            </span>
                          </div>
                          <span className="text-sm text-gray-500">رقم {hadith.bookNumber}</span>
                        </div>
                        <p className="text-gray-800 leading-relaxed mb-3" style={{ fontSize: `${fontSize - 2}px` }}>
                          {hadith.matn.substring(0, 200)}...
                        </p>
                        <div className="flex items-center justify-between text-sm text-gray-600">
                          <span>👤 {hadith.narrator}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* البحث */}
              {currentView === 'search' && (
                <div className="max-w-4xl mx-auto">
                  <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                    <h2 className="text-2xl font-bold text-golden-800 mb-4">🔍 البحث الذكي في الأحاديث</h2>

                    {/* نوع البحث */}
                    <div className="flex gap-2 mb-4 flex-wrap">
                      <button
                        onClick={() => setSearchType('matn')}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${
                          searchType === 'matn' ? 'bg-golden-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        البحث في المتن
                      </button>
                      <button
                        onClick={() => setSearchType('narrator')}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${
                          searchType === 'narrator' ? 'bg-golden-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        البحث في الراوي
                      </button>
                      <button
                        onClick={() => setSearchType('theme')}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${
                          searchType === 'theme' ? 'bg-golden-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        البحث الموضوعي
                      </button>
                      <button
                        onClick={() => setSearchType('number')}
                        className={`px-4 py-2 rounded-lg font-bold transition-all ${
                          searchType === 'number' ? 'bg-golden-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        البحث برقم الحديث
                      </button>
                    </div>

                    {/* صندوق البحث */}
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder={
                        searchType === 'matn' ? 'ابحث في متن الحديث...' :
                        searchType === 'narrator' ? 'ابحث عن راوي...' :
                        searchType === 'theme' ? 'ابحث عن موضوع...' :
                        'أدخل رقم الحديث...'
                      }
                      className="w-full px-4 py-3 border-2 border-golden-300 rounded-lg focus:border-golden-500 focus:outline-none text-lg"
                    />

                    {/* عدد النتائج */}
                    <p className="text-sm text-gray-600 mt-3">
                      {searchQuery ? `تم العثور على ${filteredHadiths.length.toLocaleString('ar')} حديث` : 'أدخل كلمة البحث'}
                    </p>
                  </div>

                  {/* نتائج البحث */}
                  <div className="space-y-4">
                    {filteredHadiths.map(hadith => (
                      <div
                        key={hadith.id}
                        onClick={() => setSelectedHadith(hadith)}
                        className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-golden-400 p-5"
                      >
                        <div className="flex items-start justify-between mb-3">
                          <div>
                            <span className={`px-3 py-1 rounded-lg text-xs font-bold ${hadith.gradeClass}`}>
                              {hadith.grade}
                            </span>
                            <span className="mr-2 text-sm text-gray-600">
                              {HADITH_BOOKS.find(b => b.id === hadith.book)?.nameAr} • رقم {hadith.bookNumber}
                            </span>
                          </div>
                        </div>
                        <p className="text-gray-800 leading-relaxed mb-3" style={{ fontSize: `${fontSize - 2}px` }}>
                          {hadith.matn.substring(0, 200)}...
                        </p>
                        <div className="flex items-center justify-between text-sm text-gray-600">
                          <span>👤 {hadith.narrator}</span>
                          <span>📂 {hadith.chapter}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* الإحصائيات */}
              {currentView === 'stats' && (
                <div className="max-w-6xl mx-auto">
                  <h2 className="text-3xl font-bold text-golden-800 mb-6 text-center">📊 إحصائيات الأحاديث النبوية</h2>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div className="bg-gradient-to-br from-golden-100 to-golden-50 rounded-xl shadow-lg p-6 text-center border-2 border-golden-300">
                      <div className="text-5xl mb-3">📚</div>
                      <div className="text-4xl font-bold text-golden-800 mb-2">
                        {HADITH_BOOKS.length}
                      </div>
                      <div className="text-gray-700">كتاب حديث</div>
                    </div>

                    <div className="bg-gradient-to-br from-bronze-100 to-bronze-50 rounded-xl shadow-lg p-6 text-center border-2 border-bronze-300">
                      <div className="text-5xl mb-3">📖</div>
                      <div className="text-4xl font-bold text-bronze-800 mb-2">
                        {HADITH_BOOKS.reduce((sum, b) => sum + b.totalHadith, 0).toLocaleString('ar')}
                      </div>
                      <div className="text-gray-700">حديث نبوي</div>
                    </div>

                    <div className="bg-gradient-to-br from-green-100 to-green-50 rounded-xl shadow-lg p-6 text-center border-2 border-green-300">
                      <div className="text-5xl mb-3">🗂️</div>
                      <div className="text-4xl font-bold text-green-800 mb-2">
                        {THEMATIC_CATEGORIES.length}
                      </div>
                      <div className="text-gray-700">تصنيف موضوعي</div>
                    </div>
                  </div>

                  {/* تفاصيل الكتب */}
                  <div className="bg-white rounded-xl shadow-lg p-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4">📊 تفاصيل كتب الحديث</h3>
                    <div className="space-y-3">
                      {HADITH_BOOKS.map(book => (
                        <div key={book.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-golden-50 transition-colors">
                          <div className="flex-1">
                            <span className="font-bold text-gray-800">{book.nameAr}</span>
                            <span className="text-sm text-gray-600 mr-2">- {book.author}</span>
                          </div>
                          <div className="flex gap-4 text-sm">
                            <span className="text-gray-700">{book.totalHadith.toLocaleString('ar')} حديث</span>
                            {book.chapters > 0 && <span className="text-gray-600">{book.chapters} باب</span>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* لوحة الإعدادات */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div className="bg-gradient-to-r from-golden-500 to-bronze-500 px-6 py-4 flex items-center justify-between rounded-t-2xl">
                  <h2 className="text-2xl font-bold text-white">⚙️ إعدادات التطبيق</h2>
                  <button
                    onClick={() => setShowSettings(false)}
                    className="text-white hover:bg-white/20 rounded-lg p-2 transition-colors"
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  {/* حجم الخط */}
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      حجم الخط: {fontSize}px
                    </label>
                    <input
                      type="range"
                      min="16"
                      max="36"
                      value={fontSize}
                      onChange={(e) => setFontSize(parseInt(e.target.value))}
                      className="w-full h-2 bg-golden-200 rounded-lg appearance-none cursor-pointer accent-golden-500"
                    />
                  </div>

                  {/* خيارات العرض */}
                  <div className="space-y-3">
                    <label className="flex items-center gap-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={showIsnad}
                        onChange={(e) => setShowIsnad(e.target.checked)}
                        className="w-5 h-5 text-golden-500 rounded focus:ring-golden-500"
                      />
                      <div className="flex-1">
                        <div className="font-bold text-gray-800">عرض السند</div>
                        <div className="text-sm text-gray-600">إظهار سلسلة الرواة للحديث</div>
                      </div>
                    </label>

                    <label className="flex items-center gap-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={showTranslation}
                        onChange={(e) => setShowTranslation(e.target.checked)}
                        className="w-5 h-5 text-golden-500 rounded focus:ring-golden-500"
                      />
                      <div className="flex-1">
                        <div className="font-bold text-gray-800">عرض الترجمة</div>
                        <div className="text-sm text-gray-600">إظهار ترجمة الحديث بالإنجليزية والأردية</div>
                      </div>
                    </label>

                    <label className="flex items-center gap-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={showSharh}
                        onChange={(e) => setShowSharh(e.target.checked)}
                        className="w-5 h-5 text-golden-500 rounded focus:ring-golden-500"
                      />
                      <div className="flex-1">
                        <div className="font-bold text-gray-800">عرض الشرح</div>
                        <div className="text-sm text-gray-600">إظهار شرح العلماء للحديث</div>
                      </div>
                    </label>
                  </div>

                  {/* الإحصائيات */}
                  <div className="bg-gradient-to-br from-golden-50 to-bronze-50 p-4 rounded-lg border-2 border-golden-200">
                    <h3 className="font-bold text-golden-800 mb-3">📊 إحصائيات التطبيق</h3>
                    <div className="grid grid-cols-2 gap-3 text-sm">
                      <div className="bg-white p-3 rounded-lg">
                        <div className="text-gray-600">عدد الكتب</div>
                        <div className="text-2xl font-bold text-golden-800">{HADITH_BOOKS.length}</div>
                      </div>
                      <div className="bg-white p-3 rounded-lg">
                        <div className="text-gray-600">إجمالي الأحاديث</div>
                        <div className="text-2xl font-bold text-golden-800">
                          {(HADITH_BOOKS.reduce((sum, b) => sum + b.totalHadith, 0) / 1000).toFixed(0)}K+
                        </div>
                      </div>
                      <div className="bg-white p-3 rounded-lg">
                        <div className="text-gray-600">التصنيفات</div>
                        <div className="text-2xl font-bold text-golden-800">{THEMATIC_CATEGORIES.length}</div>
                      </div>
                      <div className="bg-white p-3 rounded-lg">
                        <div className="text-gray-600">الأحاديث المعروضة</div>
                        <div className="text-2xl font-bold text-golden-800">{SAMPLE_HADITHS.length}</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="border-t-2 border-golden-200 px-6 py-4 flex justify-end bg-gray-50 rounded-b-2xl">
                  <button
                    onClick={() => setShowSettings(false)}
                    className="px-6 py-2 bg-golden-500 hover:bg-golden-600 text-white rounded-lg font-bold transition-colors"
                  >
                    حفظ وإغلاق
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* الشريط السفلي */}
          <footer className="bg-gradient-to-r from-golden-500 to-bronze-500 text-white py-3">
            <div className="container mx-auto px-4 text-center text-sm">
              <p>بصائر الحديث النبوي الشريف • {HADITH_BOOKS.reduce((sum, b) => sum + b.totalHadith, 0).toLocaleString('ar')}+ حديث نبوي شريف</p>
            </div>
          </footer>
        </div>
      );
    }

    // تشغيل التطبيق
    ReactDOM.render(<HadithApp />, document.getElementById('root'));
  </script>
</body>
</html>
